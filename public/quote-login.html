<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunstone Pricing — Sign in</title>
  <style>
    :root { --bg:#f4f6f8; --panel:#ffffff; --line:#d5dbe2; --text:#1a2029; --dim:#5a6673; --accent:#f5a623; --bad:#c8352b; }
    * { box-sizing: border-box; }
    body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:30px; width:350px;
      box-shadow:0 6px 24px rgba(20,30,50,.08); }
    .logo { font-size:32px; color:var(--accent); }
    h1 { font-size:17px; margin:8px 0 2px; }
    .sub { font-size:12px; color:var(--dim); margin-bottom:20px; }
    label { display:block; font-size:11px; color:var(--dim); margin-bottom:5px; }
    input { width:100%; background:#fff; border:1px solid var(--line); color:var(--text);
      padding:10px 12px; border-radius:6px; font-size:14px; }
    button { width:100%; margin-top:14px; background:var(--accent); color:#1a1408; border:none;
      padding:11px; border-radius:6px; font-weight:600; font-size:14px; cursor:pointer; }
    button:hover { background:#ffb733; }
    .msg { color:var(--bad); font-size:12px; min-height:16px; margin-top:10px; }
    .note { font-size:11px; color:var(--dim); margin-top:16px; line-height:1.5; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <div class="logo">◧</div>
    <h1>Sunstone Pricing</h1>
    <div class="sub">Enter the access code your Sunstone contact gave you.</div>
    <label for="pw">Access code</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus />
    <button type="submit">Continue</button>
    <div class="msg" id="msg"></div>
    <p class="note">This gives you self-service subscription pricing. Hardware and implementation are quoted separately — please contact your Sunstone representative.</p>
  </form>
  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      try {
        const res = await fetch('/api/client/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('pw').value }),
        });
        if (res.ok) {
          const next = new URLSearchParams(location.search).get('next') || '/quote';
          location.href = next;
        } else {
          msg.textContent = 'Incorrect access code.';
        }
      } catch (err) {
        msg.textContent = 'Network error — please try again.';
      }
    });
  </script>
</body>
</html>
